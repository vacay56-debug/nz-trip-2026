<style>
:root{color-scheme:light dark;--bg:light-dark(#faf6ef,#1c1814);--paper:light-dark(#fffdf9,#25201b);--ink:light-dark(#4a3a2f,#efe4d4);--soft:light-dark(#86705e,#bfae9c);--line:light-dark(#e2d5c3,#43392f);--warn:light-dark(#a0573c,#e29a7c)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.7 "Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;padding:16px}
form{width:min(380px,100%);background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px 22px}
h1{font-family:Georgia,serif;font-weight:600;letter-spacing:.08em;font-size:26px;line-height:1.1;margin:0 0 6px}
p{margin:0 0 18px;color:var(--soft);font-size:15px}
input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
label.r{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:15px;color:var(--soft)}
label.r input{width:20px;height:20px}
button{margin-top:16px;width:100%;min-height:48px;border:0;border-radius:99px;background:var(--ink);color:var(--paper);font:inherit;font-size:17px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--warn);min-height:1.7em;margin:10px 0 0;font-size:15px}
</style>

async function open(key){
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.v)},key,u(D.c));
 const html=new TextDecoder().decode(pt);
 document.open();document.write(html);document.close();
}
async function derive(pw){
 const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.i,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt']);
}
